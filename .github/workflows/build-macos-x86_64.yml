name: Build macOS x86_64 Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-x86_64-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64:
    name: Build Intel macOS package
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: tools/mitm_proxy/go.sum

      - name: Build x86_64 DMG and ZIP
        run: bash scripts/build_x86_64.sh

      - name: Show package metadata
        run: |
          echo "### macOS x86_64 package" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat build_output/SHA256SUMS-x86_64.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          file build_output/x86_64/AntigravityProxyLauncher.app/Contents/MacOS/AntigravityProxyLauncher >> "$GITHUB_STEP_SUMMARY"
          file build_output/x86_64/AntigravityProxyLauncher.app/Contents/Resources/libAntigravityTun.dylib >> "$GITHUB_STEP_SUMMARY"
          file build_output/x86_64/AntigravityProxyLauncher.app/Contents/Resources/mitm_proxy >> "$GITHUB_STEP_SUMMARY"

      - name: Upload x86_64 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityProxyLauncher-macos-x86_64
          path: |
            build_output/*-macos_x86_64.dmg
            build_output/*-macos_x86_64.zip
            build_output/SHA256SUMS-x86_64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
